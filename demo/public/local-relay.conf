events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $host $local_host {
        default 0;
        127.0.0.1 1;
        localhost 1;
    }
    map $http_origin $local_origin {
        default 0;
        "" 1;
        "http://127.0.0.1:18089" 1;
        "http://localhost:18089" 1;
    }
    server {
        listen 8080;
        if ($local_host = 0) { return 421; }
        if ($local_origin = 0) { return 403; }
        location / {
            set $demo_edge "edge:8080";
            proxy_pass http://$demo_edge;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1900s;
            proxy_send_timeout 1900s;
            proxy_next_upstream off;
            # Preserve workload Authorization and browser Origin. The original
            # gateway still enforces its session CSRF and workload identity.
        }
    }
}

events { worker_connections 1024; }
http {
    server_tokens off;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream gateway { zone gateway 64k; server gateway-a:8000 resolve; server gateway-b:8000 resolve; keepalive 32; }
    server {
        listen 8080;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_read_timeout 1900s;
            proxy_send_timeout 1900s;
            proxy_next_upstream off;
        }
    }
}
